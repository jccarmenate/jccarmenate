name: Update Agent Lab

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/agent-lab*.mjs'
      - '.github/workflows/agent-lab.yml'

permissions:
  contents: write

concurrency:
  group: agent-lab
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test the activity model
        run: node --test scripts/agent-lab.test.mjs
      - name: Render the lab from public REST events
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAB_OWNER: ${{ github.repository_owner }}
        run: node scripts/agent-lab.mjs
      - name: Commit updated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/agent-lab.svg assets/agent-lab-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Agent Lab activity snapshot'
          git push
