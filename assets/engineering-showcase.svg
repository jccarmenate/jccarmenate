<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc">
<title id="title">From idea to running software — Juan Carlos</title>
<desc id="desc">Four capabilities demonstrated by real projects: agent orchestration with Multi-agent Code Generator, retrieval with Tech RAG, compiler engineering with HULK IDE, and full-stack product development with GuildWork. A robot carries an idea between four stations in a fifteen-second loop. This is a conceptual showcase, not a live execution pipeline.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142139"/><stop offset="1" stop-color="#080f20"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#283a55" stroke-opacity=".3"/></pattern><linearGradient id="rail"><stop stop-color="#64e4ee"/><stop offset=".5" stop-color="#b6a2ff"/><stop offset="1" stop-color="#ffc98a"/></linearGradient></defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.wire{fill:none;stroke:currentColor;stroke-width:2;stroke-dasharray:4 5}.highlight{opacity:.14;animation:focus 15s linear infinite}.stage .signal,.stage .answer,.stage .compiled,.stage .product{animation:detail 15s ease-in-out infinite}.stage .wire{animation:flow 1.8s linear infinite}.phase1,.phase1 *{animation-delay:3.75s!important}.phase2,.phase2 *{animation-delay:7.5s!important}.phase3,.phase3 *{animation-delay:11.25s!important}.courier{animation:travel 15s ease-in-out infinite}.float{animation:bob 1.5s ease-in-out infinite}.phaseText{opacity:0;animation:label 15s linear infinite}.phaseText:first-child{opacity:1}
@keyframes focus{0%,22%{opacity:1}25%,97%{opacity:.14}100%{opacity:1}}@keyframes detail{0%{opacity:.3}12%,24%{opacity:1}30%,100%{opacity:.45}}@keyframes flow{to{stroke-dashoffset:-36}}@keyframes bob{50%{transform:translateY(-3px)}}@keyframes label{0%,23%{opacity:1}25%,100%{opacity:0}}@keyframes travel{0%,17%{transform:translateX(0);opacity:1}25%,42%{transform:translateX(237px);opacity:1}50%,67%{transform:translateX(474px);opacity:1}75%,92%{transform:translateX(711px);opacity:1}98%{transform:translateX(840px);opacity:0}99%{transform:translateX(0);opacity:0}100%{transform:translateX(0);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.highlight{opacity:.5}.phaseText{display:none}.phaseText:first-child{display:inline;opacity:1}}
</style>
<rect x="1" y="1" width="998" height="528" rx="22" fill="url(#bg)" stroke="#34465f"/><rect x="2" y="2" width="996" height="526" rx="22" fill="url(#grid)"/>
<text x="33" y="39" fill="#70dfea" font-size="11" letter-spacing="2">JUAN CARLOS / ENGINEERING IN MOTION</text>
<text x="32" y="82" fill="#f3f7ff" font-size="32" font-weight="700" letter-spacing="-1">From idea to running software.</text>
<text x="33" y="111" fill="#b6c7de" font-size="15">I build across the stack — from compilers to AI agents.</text>
